name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: familienkalender_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: familienkalender_test
      DB_USER: root
      DB_PASSWORD: ''
      APP_SECRET: ci-only-test-secret-not-for-production
      ALLOW_TEST_DB_WIPE: '1'
      CI: '1'

    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, mbstring, json, openssl
          coverage: none

      - name: Composer-Dependencies installieren (Dev, inkl. PHPUnit)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntax-Check (php -l) über das gesamte Repo
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Unit-Tests (keine DB nötig)
        run: composer test

      - name: Warten auf MySQL
        run: |
          for i in $(seq 1 20); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot --silent && break
            sleep 2
          done

      - name: Integration-Tests (echte MySQL-Testdatenbank)
        run: composer test:integration
